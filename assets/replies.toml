[config.danger_zones]
select = """
## 🛠️ Configure Danger Zones
Select danger zones to be observed by {CloakerBot}.
For more info use {/help command:config danger-zones}.
"""

set = """
## 🪤 Configured Danger Zones
Set the following channels as danger zones:
{channels}

-# > {quote}
"""

unset = """
## 🗑️ Unset Danger Zones
No danger zones are set now.

-# > {quote}
"""

[config.immunity.general]
select = """
## 🛠️ Configure General Immunity Roles
Select what roles should be immune to **all** kind of takedowns by {CloakerBot}.
For more info use {/help command:config immunity}.
"""

set = """
## 🛡️ Configured General Immunity Roles
The following roles are now immune to **all** takedowns by {CloakerBot}:
{roles}

-# > {quote}
"""

unset = """
## 🗑️ Unset General Immunity Roles
No **general** immunity roles are set now.

-# > {quote}
"""

[config.immunity.general.silent]
select = """
## 🛠️ Configure General Silent Immunity Roles
Select what roles should be immune to **all** kind of takedowns by {CloakerBot}.
Takedowns targeting these roles won't even initialize.
For more info use {/help command:config immunity}.
"""

set = """
## 🛡️ Configured General Immunity Roles
The following roles are now immune to **all** takedowns by {CloakerBot}:
{roles}

Takedowns targeting these roles won't even initialize.

-# > {quote}
"""

unset = """
## 🗑️ Unset General Immunity Roles
No **silent general** immunity roles are set now.

-# > {quote}
"""

[config.immunity.random]
select = """
## 🛠️ Configure Random Immunity Roles
Select what roles should be immune to **random** takedowns by {CloakerBot}.
For more info use {/help command:config immunity}.
"""

set = """
## 🛡️ Configured Random Immunity Roles
The following roles are now immune to **random** takedowns by {CloakerBot}:
{roles}

-# > {quote}
"""

unset = """
## 🗑️ Unset Random Immunity Roles
No **random** immunity roles are set now.

-# > {quote}
"""

[config.immunity.random.silent]
select = """
## 🛠️ Configure Random Silent Immunity Roles
Select what roles should be immune to **random** takedowns by {CloakerBot}.
Takedowns targeting these roles won't even initialize.
For more info use {/help command: config immunity}.
"""

set = """
## 🛡️ Configured Random Immunity Roles
The following roles are now immune to **random** takedowns by {CloakerBot}:
{roles}

Takedowns targeting these roles won't even initialize.

-# > {quote}
"""

unset = """
## 🗑️ Unset Random Immunity Roles
No **random** immunity roles are set now.

-# > {quote}
"""


[config.log_channel]
select = """
## 🛠️ Configure Log Channel
Select channel for {CloakerBot} to log into.
If unset this defaults to {default}.
"""

set = """
## 📝 Configured Log Channel
Logs will be written in {log-channel}.
Make sure {CloakerBot} is allowed to chat there.

-# > {quote}
"""

unset = """
## 🗑️ Unset Log Channel
No log channel is defined.
Fallback channel is {default} if {CloakerBot} is allowed to chat there.

-# > {quote}
"""

[config.random]
disabled = """
## 🛑 No Random Takedowns
Random takedowns are **disabled**.

-# > {quote}
"""

enabled = """
## 💫 Random Takedowns Enabled
Random takedowns are **enabled**.
Takedowns are checked in an interval between **{#min}** hours and **{#max}** \
hours.

With {/help command:config random} and the `min` and `max` options you can \
modify the time interval.

-# > {quote}
"""

[config.target_bots]
disabled = """
## 🚸 Don't Target Bots
Bots are no valid targets.

-# > {quote}
"""

enabled = """
## 🤖🔫 Targeting Bots
Bots are valid targets for takedowns.
This also applies to random takedowns.

-# > {quote}
"""

[help]
overview = """
## 🔎 Help Overview
For more info and help on a command, use `/help command:<command name>`.
"""

support = """
### CloakerBot Discord Server
If you have any issues come over to the [discord server](https://cptpiepmatz.de/cloaker-bot/join-server) and ask there.
"""

title = "## 🔎 Help on "

[cloaker]
success = """
## 🎯 Takedown Successful
You succesfully took down {target}.

-# > {quote}
"""

countered = """
## 🔄 Takedown Got Countered
The takedown was countered by {counterer}.

-# > {quote}
"""

[cloaker.fail]
template = """
## ❌ Takedown Failed
{reason}

-# > {quote}
"""

join = "Failed to join voice channel."
missing-perms = "Missing permissions to remove target from channel."
not-found = "Could not find the target in a voice channel."
fled = "Target fled from the channel."
immune = "Target is immune to takedowns."
rejected = "{CloakerBot} got moved from voice channel."
other = "An error occured: \n> {error}"

[counter]
success = """
## 🏸 Counter Successful
You countered the takedown on {target}.

-# > {quote}
"""

miss = """
## 🪠 Nothing to Counter
No takedown currently happening.

-# > {quote}
"""
