<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloakerBot connected</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <style>
      html {
        overflow-y: auto;
        background-color: var(--bulma-scheme-main-ter);
      }

      .hero {
        background-color: var(--bulma-scheme-main-ter);
      }

      .box {
        background-color: var(--bulma-scheme-main);
      }

      :root {
        --bulma-primary-h: 111.818deg;
        --bulma-primary-s: 61.29%;
        --bulma-primary-l: 50.588%;
      }
    </style>
  </head>
  <body>
    <main class="hero is-fullheight">
      <div class="hero-body">
        <div class="container">
          <div class="columns is-centered">
            <div class="column is-8-tablet is-6-desktop">
              <section class="box p-6 has-text-centered" aria-labelledby="connected-title">
                <figure class="image is-96x96 mx-auto mb-4">
                  <img class="is-rounded" src="/icon.png" alt="CloakerBot" width="96" height="96">
                </figure>
                <p class="tag is-primary is-light mb-5">CloakerBot</p>
                <h1 id="connected-title" class="title is-3">Account connected 🔗</h1>
                <p class="block">Your global takedown, victim, and counter stats are now available for Discord linked roles and will update automatically.</p>
                <a class="button is-primary" href="https://discord.com/channels/@me/">Return to Discord</a>
                <p class="is-size-7 has-text-grey mt-4">You can safely close this page.</p>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
