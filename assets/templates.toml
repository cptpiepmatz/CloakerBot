## 🚸 Don't Target Bots
Bots are no valid targets.

-# > {quote}
"""

enabled = """
## 🤖🔫 Targeting Bots
Bots are valid targets for takedowns.
This also applies to random takedowns.

-# > {quote}
"""

[config.target_bots.modal]
title = "Configure bot targeting"
label = "Target bots"
description = "Allow takedowns against bots, including random takedowns. Allowed by default."
allowed = "Allowed"
protected = "Protected"

