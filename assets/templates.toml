[config]
manage_permission_required = "You need Manage Server permission to change the configuration."
menu = """
## 🛠️ Configure CloakerBot
Configure the {CloakerBot} to be as chaotic as you want.
Choose a section below to edit its settings. \
Changes are saved only when you submit the form.
"""

[config.danger_zones]
select = """
## 🛠️ Configure Danger Zones
Select danger zones to be observed by {CloakerBot}.
For more info use {/help topic:danger zones}.
"""

set = """
## 🪤 Configured Danger Zones
Set the following channels as danger zones:
{channels}

-# > {quote}
"""

unset = """
## 🗑️ Unset Danger Zones
No danger zones are set now.

-# > {quote}
"""

[config.danger_zones.modal]
title = "Configure danger zones"
label = "Danger zones"
description = "Choose voice channels that trigger automatic takedowns. Clear the selection to unset."

[config.immunity]
saved = "## 🛡️ Immunity Settings Saved"
general_roles = """
**General immunity**
-# protected from all takedowns
{roles}
"""
random_roles = """
**Random immunity**
-# protected from random takedowns only
{roles}
"""
general_silent_roles = """
**Silent general immunity**
-# never targeted by any takedown
{roles}
"""
random_silent_roles = """
**Silent random immunity**
-# never selected for random takedowns
{roles}
"""
unset_hint = "*Clear a role selection to unset that immunity type.*"
none = "None"

[config.immunity.general]
select = """
## 🛠️ Configure General Immunity Roles
Select what roles should be immune to **all** kind of takedowns by {CloakerBot}.
For more info use {/help topic:immunity}.
"""

set = """
## 🛡️ Configured General Immunity Roles
The following roles are now immune to **all** takedowns by {CloakerBot}:
{roles}

-# > {quote}
"""

unset = """
## 🗑️ Unset General Immunity Roles
No **general** immunity roles are set now.

-# > {quote}
"""

[config.immunity.general.silent]
select = """
## 🛠️ Configure General Silent Immunity Roles
Select what roles should be immune to **all** kind of takedowns by {CloakerBot}.
Takedowns targeting these roles won't even initialize.
For more info use {/help topic:immunity}.
"""

set = """
## 🛡️ Configured General Immunity Roles
The following roles are now immune to **all** takedowns by {CloakerBot}:
{roles}

Takedowns targeting these roles won't even initialize.

-# > {quote}
"""

unset = """
## 🗑️ Unset General Immunity Roles
No **silent general** immunity roles are set now.

-# > {quote}
"""

[config.immunity.modal]
title = "Immunity"

[config.immunity.modal.general]
label = "General immunity"
description = "Protected from all takedowns."

[config.immunity.modal.general_silent]
label = "Silent general immunity"
description = "Never targeted by any takedown."

[config.immunity.modal.random]
label = "Random immunity"
description = "Protected from random takedowns only."

[config.immunity.modal.random_silent]
label = "Silent random immunity"
description = "Never selected for random takedowns."

[config.immunity.random]
select = """
## 🛠️ Configure Random Immunity Roles
Select what roles should be immune to **random** takedowns by {CloakerBot}.
For more info use {/help topic:immunity}.
"""

set = """
## 🛡️ Configured Random Immunity Roles
The following roles are now immune to **random** takedowns by {CloakerBot}:
{roles}

-# > {quote}
"""

unset = """
## 🗑️ Unset Random Immunity Roles
No **random** immunity roles are set now.

-# > {quote}
"""

[config.immunity.random.silent]
select = """
## 🛠️ Configure Random Silent Immunity Roles
Select what roles should be immune to **random** takedowns by {CloakerBot}.
Takedowns targeting these roles won't even initialize.
For more info use {/help topic:immunity}.
"""

set = """
## 🛡️ Configured Random Immunity Roles
The following roles are now immune to **random** takedowns by {CloakerBot}:
{roles}

Takedowns targeting these roles won't even initialize.

-# > {quote}
"""

unset = """
## 🗑️ Unset Random Immunity Roles
No **random** immunity roles are set now.

-# > {quote}
"""

[config.log_channel]
select = """
## 🛠️ Configure Log Channel
Select channel for {CloakerBot} to log into.
If unset this defaults to {default}.
"""

set = """
## 📝 Configured Log Channel
Logs will be written in {log-channel}.
Make sure {CloakerBot} is allowed to chat there.

-# > {quote}
"""

unset = """
## 🗑️ Unset Log Channel
No log channel is defined.
Fallback channel is {default} if {CloakerBot} is allowed to chat there.

-# > {quote}
"""

[config.log_channel.modal]
title = "Configure log channel"
label = "Log channel"
description = "Choose a text channel. Clear the selection to use the automatic fallback."

[config.random]
invalid_interval = """
Nothing was saved. Intervals must be positive numbers of hours, at most 8760. \
Leave blank or enter -1 for defaults. Open Random takedowns in /config to try \
again."""
invalid_interval_order = """
Nothing was saved. The minimum interval cannot exceed the maximum interval \
(including defaults). Open Random takedowns in /config to try again."""
disabled = """
## 🛑 No Random Takedowns
Random takedowns are **disabled**.

-# > {quote}
"""

enabled = """
## 💫 Random Takedowns Enabled
Random takedowns are **enabled**.
Takedowns are checked in an interval between **{#min}** hours and **{#max}** \
hours.

Open `/config` and configure Random takedowns to modify the time interval. \
For more info use {/help topic:random takedowns}.

-# > {quote}
"""

[config.random.modal]
title = "Configure random takedowns"
label = "Random takedowns"
description = "Enable or disable automatic random takedowns."
enabled = "Enabled"
disabled = "Disabled"
interval_description = "Enter hours, up to 8760. Leave blank or enter -1 to restore the default."

[config.random.modal.max]
label = "Maximum interval (hours)"
placeholder = "Default: 24 hours"

[config.random.modal.min]
label = "Minimum interval (hours)"
placeholder = "Default: 1 hour"

