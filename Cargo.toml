[package]
name = "cloaker-bot"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "CloakerBot"
path = "src/main.rs"

[dependencies]

# data serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# concurrency
parking_lot = "0.12"

# time management
chrono = "0.4"

# utility
const_format = { version = "0.2", features = ["rust_1_51"] }
konst = "0.3"
rand = "0.8"
toml = "0.8"
static-toml = "1"
derive_more = "0.99"
itertools = "0.11"

# logging
[dependencies.paris]
version = "1"
features = ["macros", "no_logger"]

# discord integration
[dependencies.twilight-cache-inmemory]
git = "https://github.com/twilight-rs/twilight.git"
rev = "879bd592e85a8f64261a72622703fe548b21228a"
version = "0.15"

[dependencies.twilight-gateway]
git = "https://github.com/twilight-rs/twilight.git"
rev = "879bd592e85a8f64261a72622703fe548b21228a"
version = "0.15"

[dependencies.twilight-http]
git = "https://github.com/twilight-rs/twilight.git"
rev = "879bd592e85a8f64261a72622703fe548b21228a"
version = "0.15"

[dependencies.twilight-model]
git = "https://github.com/twilight-rs/twilight.git"
rev = "879bd592e85a8f64261a72622703fe548b21228a"
version = "0.15"

[dependencies.twilight-mention]
git = "https://github.com/twilight-rs/twilight.git"
rev = "879bd592e85a8f64261a72622703fe548b21228a"
version = "0.15"

[dependencies.twilight-util]
git = "https://github.com/twilight-rs/twilight.git"
rev = "879bd592e85a8f64261a72622703fe548b21228a"
version = "0.15"
features = ["builder"]

[dependencies.twilight-validate]
git = "https://github.com/twilight-rs/twilight.git"
rev = "879bd592e85a8f64261a72622703fe548b21228a"
version = "0.15"

# discord audio
[dependencies.songbird]
git = "https://github.com/serenity-rs/songbird.git"
rev = "3ac17b62a66d22089d822962a53970bd4731ac09"
version = "0.3"
default-features = false
features = ["driver", "gateway", "twilight", "rustls"]
