[package]
name = "cloaker-bot"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "CloakerBot"
path = "src/main.rs"

[dependencies]

# discord integration
twilight-cache-inmemory = { version = "0.15", path = "../twilight/twilight-cache-inmemory" }
twilight-gateway = { version = "0.15", path = "../twilight/twilight-gateway" }
twilight-http = { version = "0.15", path = "../twilight/twilight-http" }
twilight-model = { version = "0.15", path = "../twilight/twilight-model" }
twilight-mention = { version = "0.15", path = "../twilight/twilight-mention" }
twilight-util = { version = "0.15", features = ["builder"], path = "../twilight/twilight-util" }
twilight-validate = { version = "0.15", path = "../twilight/twilight-validate" }

# data serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# time management
chrono = "0.4"

# utility
const_format = { version = "0.2", features = ["rust_1_51"] }
konst = "0.3"
rand = "0.8"
toml = "0.8"
static-toml = "1"
derive_more = "0.99"
itertools = "0.11"

# logging
[dependencies.paris]
version = "1"
features = ["macros", "no_logger"]
