[package]
name = "cloaker-bot"
version = "3.0.0"
edition = "2021"


[dependencies]

# discord integration
twilight-cache-inmemory = "0.14"
twilight-gateway = "0.14"
twilight-http = "0.14"
twilight-model = "0.14"
twilight-lavalink = "0.14"
twilight-mention = "0.14"
twilight-util = { version = "0.14", features = ["builder", "permission-calculator"] }

# async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
dashmap = "5"

# image manipulation
image = "0.24"

# logging
log = "0.4"

# error handling
anyhow = "1"

# lavalink for audio
java-locator = "0.1"

# database
serde = { version = "1", features = ["derive"] }
[dependencies.surrealdb]
git = "https://github.com/surrealdb/surrealdb.git"
rev = "7fabf54593e25681c6d1180a8b803d4439f11f50"
default-features = false
features = [
    "kv-mem",
    "kv-rocksdb"
]


[build-dependencies]
java-locator = "0.1"
reqwest = { version = "0.11", features = ["blocking"] }
