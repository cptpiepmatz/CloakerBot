[package]
name = "cloaker-bot"
version.workspace = true
edition.workspace = true
default-run = "CloakerBot"

[[bin]]
name = "CloakerBot"
path = "src/main.rs"

[features]
default = ["dev"]
prod = []
dev = []

[workspace]
members = ["common", "macros"]
package.version = "3.0.0"
package.edition = "2024"

[workspace.dependencies]
itertools = "0.14"
hound = "3.5"

[dependencies]

# data serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# http request
reqwest = { version = "0.12", features = ["json"] }

# async
tokio = { version = "1", features = ["full", "tracing"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
console-subscriber = "0.4"

# concurrency
parking_lot = "0.12"

# time management
chrono = { version = "0.4", features = ["serde"] }

# utility
bitflags = "2.9"
bytes = "1.10"
common = { path = "./common", package = "cloaker-bot-common" }
const_format = { version = "0.2", features = ["rust_1_51"] }
derive_more = { version = "2", features = ["full"] }
heapless = "0.8"
itertools.workspace = true
konst = "0.3"
macros = { path = "./macros", package = "cloaker-bot-macros" }
rand = "0.9"
smart-default = "0.7"
static-toml = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"

# discord integration
twilight-cache-inmemory = "0.16.0"
twilight-gateway = "0.16.0"
twilight-http = "0.16.0"
twilight-mention = "0.16.0"
twilight-model = "0.16.0"
twilight-util = { version = "0.16.0", features = ["builder"] }
twilight-validate = "0.16.0"

# user rank images
hieroglyph = "0.1"
image = "0.25"
imageproc = "0.25"

# http server for oauth
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
cookie = "0.18"
url = "2.5"
http = "1.3"
mime = "0.3"

# audio handling
wav = "1"
hound.workspace = true
symphonia = "0.5"

[dependencies.songbird]
version = "0.5"
default-features = false
features = ["driver", "gateway", "twilight", "rustls", "tungstenite"]

# logging
[dependencies.paris]
version = "1"
features = ["macros", "no_logger"]

[build-dependencies]
hound.workspace = true

[patch.crates-io.twilight-http-ratelimiting]
git = "https://github.com/cptpiepmatz/twilight.git"
branch = "patch/0.16.0/role-connection"
