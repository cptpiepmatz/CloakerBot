[package]
name = "cloaker-bot"
version.workspace = true
edition.workspace = true
default-run = "CloakerBot"

[[bin]]
name = "CloakerBot"
path = "src/main.rs"

[workspace]
members = ["macros"]
package.version = "3.0.0"
package.edition = "2024"

[workspace.dependencies]
itertools = "0.14"
hound = "3.5"

[dependencies]

# data serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# http request
reqwest = "0.12"

# async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# concurrency
parking_lot = "0.12"

# time management
chrono = { version = "0.4", features = ["serde"] }

# utility
bitflags = "2.9"
bytes = "1.10"
const_format = { version = "0.2", features = ["rust_1_51"] }
derive_more = { version = "2", features = ["full"] }
heapless = "0.8"
itertools.workspace = true
konst = "0.3"
macros = { path = "./macros", package = "cloaker-bot-macros" }
rand = "0.9"
smart-default = "0.7"
static-toml = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"

# discord integration
twilight-cache-inmemory = "=0.16.0-rc.1"
twilight-gateway = "=0.16.0-rc.1"
twilight-http = "=0.16.0-rc.1"
twilight-mention = "=0.16.0-rc.1"
twilight-model = "=0.16.0-rc.1"
twilight-util = { version = "=0.16.0-rc.1", features = ["builder"] }
twilight-validate = "=0.16.0-rc.1"

# user rank images
hieroglyph = "0.1"
image = "0.25"
imageproc = "0.25"

# audio handling
wav = "1"
hound.workspace = true
symphonia = "0.5"

[dependencies.songbird]
git = "https://github.com/Erk-/songbird.git"
branch = "erk/twilight-0-16-rc"
version = "0.4"
default-features = false
features = ["driver", "gateway", "twilight", "rustls", "tungstenite"]

# logging
[dependencies.paris]
version = "1"
features = ["macros", "no_logger"]

[build-dependencies]
hound.workspace = true
