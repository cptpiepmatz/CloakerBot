[package]
name = "cloaker-bot"
version.workspace = true
edition.workspace = true

[[bin]]
name = "CloakerBot"
path = "src/main.rs"

[workspace]
members = ["macros"]
package.version = "3.0.0"
package.edition = "2021"

[workspace.dependencies]
itertools = "0.13"

[dependencies]

# data serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# http request
reqwest = "0.12"

# async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# concurrency
parking_lot = "0.12"
#dashmap = "5"

# time management
chrono = { version = "0.4", features = ["serde"] }

# utility
const_format = { version = "0.2", features = ["rust_1_51"] }
konst = "0.3"
rand = "0.8"
toml = "0.8"
static-toml = "1"
derive_more = "0.99"
itertools.workspace = true
smart-default = "0.7"
heapless = "0.8"
bitflags = "2.9"
thiserror = "2"
macros = { path = "./macros", package = "cloaker-bot-macros" }

# discord integration
twilight-cache-inmemory= "=0.16.0-rc.1"
twilight-gateway= "=0.16.0-rc.1"
twilight-http= "=0.16.0-rc.1"
twilight-model= "=0.16.0-rc.1"
twilight-mention= "=0.16.0-rc.1"
twilight-util= {version = "=0.16.0-rc.1", features = ["builder"]}
twilight-validate= "=0.16.0-rc.1"

# user rank images
image = "0.25"
imageproc = "0.25"
hieroglyph = "0.1"

# logging
[dependencies.paris]
version = "1"
features = ["macros", "no_logger"]

# audio handling
[dependencies.wav]
version = "1"

[dependencies.symphonia]
version = "0.5"

[dependencies.songbird]
git = "https://github.com/Erk-/songbird.git"
branch = "erk/twilight-0-16-rc"
version = "0.4"
default-features = false
features = ["driver", "gateway", "twilight", "rustls", "tungstenite"]
