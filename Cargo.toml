[package]
name = "cloaker-bot"
repository = "https://github.com/cptpiepmatz/CloakerBot"
version.workspace = true
edition.workspace = true
default-run = "CloakerBot"

[package.metadata]
discord_invite = "https://discord.gg/XMsdwM5NXf"

[[bin]]
name = "CloakerBot"
path = "src/main.rs"

[features]
default = ["dev"]
prod = []
dev = []

[workspace]
members = ["macros"]
package.version = "3.0.0"
package.edition = "2024"

[profile.dev.package.serenity-voice-model]
debug-assertions = false

[workspace.dependencies]
itertools = "0.15"
hound = "3.5"

[dependencies]
# custom libs
macros = { path = "./macros", package = "cloaker-bot-macros" }

# data serialization
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# persistence
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# async
tokio = { version = "1", features = ["full", "tracing"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# concurrency
parking_lot = "0.13"

# time management
chrono = { version = "0.4", features = ["serde"] }

# utility
bitflags = "2.9"
const_format = { version = "0.2", features = ["rust_1_51"] }
derive_more = { version = "2", features = ["full"] }
heapless = "0.9"
itertools.workspace = true
konst = "0.4"
rand = "0.10"
smart-default = "0.7"
static-toml = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# discord integration
twilight-cache-inmemory = { version = "0.17", features = ["permission-calculator"] }
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-mention = "0.17"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
twilight-validate = "0.17"

# http server for oauth
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie", "cookie-signed"] }
cookie = "0.18"
url = "2.5"
http = "1.3"
mime = "0.3"
sha2 = "0.11"

# audio handling
wav = "1"
hound.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm"] }

[dependencies.songbird]
version = "0.6"
default-features = false
features = ["driver", "gateway", "twilight", "rustls", "tungstenite"]

# http request
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "form", "rustls-no-provider"]

# logging
[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
features = ["chrono", "env-filter", "json"]

[build-dependencies]
hound.workspace = true

[dev-dependencies]
tempfile = "3"
