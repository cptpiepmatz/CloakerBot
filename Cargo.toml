[package]
name = "cloaker-bot"
version = "3.0.0"
edition = "2021"


[dependencies]

# discord integration
twilight-cache-inmemory = "0.14"
twilight-gateway = "0.14"
twilight-http = "0.14"
twilight-model = "0.14"
twilight-lavalink = "0.14"
twilight-mention = "0.14"
twilight-util = { version = "0.14", features = ["builder"] }

# async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# database
surrealdb = { git = "https://github.com/surrealdb/surrealdb.git", rev = "d7c26bd64b7385701bc3ff46419f86de19701523" }

# image manipulation
image = "0.24"

# logging
log = "0.4"

# lavalink for audio
java-locator = "0.1"

[build-dependencies]
java-locator = "0.1"
reqwest = { version = "0.11", features = ["blocking"] }
