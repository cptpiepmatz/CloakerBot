[package]
name = "cloaker-bot"
version = "3.0.0"
edition = "2021"


[dependencies]

# discord integration
twilight-cache-inmemory = "0.15.2"
twilight-gateway = "0.15.2"
twilight-http = "0.15.2"
twilight-model = "0.15.2"
twilight-mention = "0.15.1"

# data serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# time management
chrono = "0.4"

# utility
const_format = "0.2"

# logging
[dependencies.paris]
version = "1"
features = ["macros", "no_logger"]
