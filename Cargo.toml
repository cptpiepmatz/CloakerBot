[package]
name = "cloaker-bot"
publish = false
description = "A Discord bot that takes down users in voice channels with Cloaker sounds."
license-file.workspace = true
rust-version.workspace = true
repository = "https://github.com/cptpiepmatz/CloakerBot"
version.workspace = true
edition.workspace = true
default-run = "CloakerBot"

[package.metadata]
discord.invite = "https://discord.gg/XMsdwM5NXf"
git.default-branch = "main"

[[bin]]
name = "CloakerBot"
path = "src/main.rs"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(prod)"]

[workspace]
members = ["infra", "macros", "macros/proc"]
package.version = "3.0.1"
package.edition = "2024"
package.rust-version = "1.95.0"
package.license-file = "LICENSE"

[profile.dev.package.serenity-voice-model]
debug-assertions = false

[workspace.dependencies]
# custom libs
infra = { path = "./infra", package = "cloaker-bot-infra" }
macros = { path = "./macros", package = "cloaker-bot-macros" }

# data serialization
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static-toml = "1"

# persistence
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# async
tokio = { version = "1", features = ["full", "tracing"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# concurrency
parking_lot = "0.13"

# time management
chrono = { version = "0.4", features = ["serde"] }

# utility
bitflags = "2.9"
const_format = { version = "0.2", features = ["rust_1_51"] }
derive_more = { version = "2", features = ["full"] }
itertools = "0.15"
konst = "0.4"
rand = "0.10"
smart-default = "0.7"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# discord integration
twilight-cache-inmemory = { version = "0.17", features = ["permission-calculator"] }
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-mention = "0.17"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
twilight-validate = "0.17"

# http server for oauth
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie", "cookie-signed"] }
cookie = "0.18"
url = "2.5"
http = "1.3"
mime = "0.3"
sha2 = "0.11"

# audio handling
wav = "1"
hound = "3.5"
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm"] }

# procedural macros
heck = "0.5.0"
proc-macro2 = "1"
quote = "1"
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-cmark-to-cmark = "22"
regex = "1.11"
scraper = { version = "0.29", default-features = false }
syn = "3"
toml = "1.1"

# testing
indoc = "2"
tempfile = "3"

[workspace.dependencies.songbird]
version = "0.6"
default-features = false
features = ["driver", "gateway", "twilight", "rustls", "tungstenite"]

# http request
[workspace.dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "form", "rustls-no-provider"]

# logging
[workspace.dependencies.tracing]
version = "0.1"

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = ["chrono", "env-filter", "json"]

[dependencies]
async-trait.workspace = true
axum-extra.workspace = true
axum.workspace = true
base64.workspace = true
bitflags.workspace = true
chrono.workspace = true
const_format.workspace = true
cookie.workspace = true
derive_more.workspace = true
futures.workspace = true
http.workspace = true
infra.workspace = true
itertools.workspace = true
konst.workspace = true
macros.workspace = true
miette.workspace = true
mime.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
smart-default.workspace = true
songbird.workspace = true
sqlx.workspace = true
static-toml.workspace = true
strum.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tokio-stream.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
twilight-cache-inmemory.workspace = true
twilight-gateway.workspace = true
twilight-http.workspace = true
twilight-mention.workspace = true
twilight-model.workspace = true
twilight-util.workspace = true
twilight-validate.workspace = true
url.workspace = true
wav.workspace = true

[build-dependencies]
hound.workspace = true
quote.workspace = true
static-toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
