[package]
name = "cloaker-bot-macros"
publish = false
description = "Internal procedural macros for CloakerBot."
license-file.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1"
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-cmark-to-cmark = "22"
quote.workspace = true
regex = "1.11"
scraper = { version = "0.24", default-features = false }
syn = "3"
toml = "1.1"

[dev-dependencies]
indoc = "2"
