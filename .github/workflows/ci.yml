name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  test:
    name: Rust (${{ matrix.mode }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings ${{ matrix.mode == 'prod' && '--cfg prod' || '' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.mode }}
      - name: Run tests
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --locked --workspace
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
